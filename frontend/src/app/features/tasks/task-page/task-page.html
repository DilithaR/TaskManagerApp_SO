<div class="layout">
  <section>
    <h2>Tasks</h2>
    <p>{{ error }}</p>
    <ul>
      @for (t of tasks; track t.id) {
        <li>
          <strong>{{ t.title }}</strong>
          <span>{{ t.isCompleted ? 'done' : 'open' }}</span>
          <button type="button" (click)="startEdit(t)">Edit</button>
          <button type="button" (click)="toggle(t)">Toggle</button>
          <button type="button" (click)="remove(t)">Delete</button>
        </li>
      }
    </ul>
  </section>

  <section>
    <h2>{{ editingId === null ? 'Add task' : 'Update task' }}</h2>
    <p>{{ editingId === null ? 'New task' : 'Editing id ' + editingId }}</p>
    <form (ngSubmit)="save()">
      <input name="title" [(ngModel)]="title" placeholder="Title" />
      <input name="description" [(ngModel)]="description" placeholder="Description" />
      <button type="submit">
        {{ editingId === null ? 'Add' : 'Update' }}
      </button>
    </form>
  </section>
</div>
